<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/styles/styles.css">
</head>
<body>
<header>
    <nav id="navbar" class="navbar navbar-expand-lg bg-primary position-fixed w-100 top-0">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">IJSE</a>
            <button id="menu_btn" type="button" class="btn btn-info">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>
</header>
<main>
    <aside id="sidebar" class="position-fixed bottom-0 margin-auto bg-primary-subtle">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
            <li class="nav-item m-2">
                <a class="nav-link"href="#">Dashboard</a>
            </li>
            <li class="nav-item m-2">
                <a class="nav-link" href="student.html">Student Management</a>
            </li>
            <li class="nav-item m-2 text-primary">
                <a class="nav-link" href="#">Course Management</a>
            </li>
            <li class="nav-item m-2">
                <a class="nav-link" href="#">Registration Management</a>
            </li>
        </ul>
    </aside>
    <section id="content" class="p-5">

        <form class="w-50 m-auto">
            <h1 class="text-center">Course Management</h1>
            <div class="mb-3">
                <label for="course_id_input" class="form-label">ID</label>
                <input type="number" class="form-control" id="course_id_input">
            </div>
            <div class="mb-3">
                <label for="course_name_input" class="form-label">Name</label>
                <input type="text" class="form-control" id="course_name_input">
            </div>
            <div class="mb-3">
                <label for="course_credits_input" class="form-label">Credits</label>
                <input type="number" class="form-control" id="course_credits_input">
            </div>

            <div class="text-end">
                <button type="button" id="course_save_btn" class="btn btn-success">Save</button>
                <button type="button" id="course_update_btn" class="btn btn-primary">Update</button>
                <button type="button" id="course_delete_btn" class="btn btn-danger">Delete</button>
                <button type="reset" id="course_reset_btn" class="btn btn-info">Reset</button>
            </div>
        </form>

        <table class="table m-5">
            <thead>
            <tr>
                <th scope="col">#ID</th>
                <th scope="col">Name</th>
                <th scope="credits">Credits</th>
            </tr>
            </thead>
            <tbody id="course_tbody">

            </tbody>
        </table>

    </section>
</main>

<script src="../assets/lib/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script src="controller/SidebarController.js"></script>
<script type="module" src="controller/CourseController.js"></script>

</body>
</html>
